{%extends 'base.html'%} 

<h1>{% block title %}Log In{%endblock%}</h1>

{%block header%}
{%endblock%} 

{% block content %}
<form method="post">
  <div class="form-floating">
    <input name="username" id="username" class="form-control" required />
    <label for="username">Username</label>
  </div>
  <div class="form-floating">
    <input
      type="password"
      name="password"
      id="password"
      class="form-control"
      required
    />
    <label for="password">Password</label>
  </div>
  <input type="submit" value="Log In" class="rounded-0 login-btn" />
</form>
{% endblock %}
